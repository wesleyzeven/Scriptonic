name: scriptonic-acceptance

# Acceptance stack for the Scriptonic company site + customer portal.
# Image scriptonic-web:acceptance is built by .github/workflows/deploy-acceptance.yml
# on the self-hosted runner before this compose file is brought up.
#
# Reachable via nginx-proxy-manager at scriptonic-acc.local.io.
# Host ports:
#   Web : 8230
#   DB  : none (SQLite in the umbraco-data volume)

services:
  scriptonic-web:
    image: scriptonic-web:acceptance
    container_name: scriptonic-acc-web
    restart: unless-stopped
    ports:
      - "8230:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # First-boot unattended install; no-op once installed.
      Umbraco__CMS__Unattended__InstallUnattended: "true"
      Umbraco__CMS__Unattended__UnattendedUserName: ${UMBRACO_ADMIN_NAME:-Administrator}
      Umbraco__CMS__Unattended__UnattendedUserEmail: ${UMBRACO_ADMIN_EMAIL:?UMBRACO_ADMIN_EMAIL is required}
      Umbraco__CMS__Unattended__UnattendedUserPassword: ${UMBRACO_ADMIN_PASSWORD:?UMBRACO_ADMIN_PASSWORD is required}
      Umbraco__CMS__WebRouting__UmbracoApplicationUrl: https://scriptonic-acc.local.io
      Umbraco__CMS__Global__UseHttps: "true"
      Site__PublicBaseUrl: https://scriptonic-acc.local.io
      Site__AdminKey: ${SITE_ADMIN_KEY:?SITE_ADMIN_KEY is required}
      # Acceptance normally runs in demo mode (empty token): the portal shows
      # sample data and a demo member is seeded.
      Site__Eboekhouden__ApiToken: ${EBOEKHOUDEN_API_TOKEN:-}
      Site__Portal__SeedDemoMember: "true"
      Site__AnalyticsScriptUrl: ${ANALYTICS_SCRIPT_URL:-}
    volumes:
      - umbraco-data:/app/umbraco/Data
      - umbraco-media:/app/wwwroot/media
      - umbraco-logs:/app/umbraco/Logs
    networks:
      - scriptonic-acc

volumes:
  umbraco-data:
    name: scriptonic-acceptance-umbraco-data
  umbraco-media:
    name: scriptonic-acceptance-umbraco-media
  umbraco-logs:
    name: scriptonic-acceptance-umbraco-logs

networks:
  scriptonic-acc:
    name: scriptonic-acceptance
    driver: bridge
